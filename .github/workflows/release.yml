name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, cross: false }
          # ARM64 Linux is cross-compiled: `cross` runs the build under QEMU,
          # which validates that the code *builds*, not how the filesystem
          # behaves. Filesystem semantics are covered by the native CI matrix.
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, cross: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, cross: false }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, cross: false }
          - { os: macos-latest, target: x86_64-apple-darwin, cross: false }
          - { os: macos-latest, target: aarch64-apple-darwin, cross: false }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - if: matrix.cross
        run: cargo install cross --locked
      - if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}
      - if: '!matrix.cross'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          bin=photorg
          out=photorg-${{ matrix.target }}
          mkdir -p "dist/$out"
          if [ -f "target/${{ matrix.target }}/release/$bin.exe" ]; then
            cp "target/${{ matrix.target }}/release/$bin.exe" "dist/$out/"
          else
            cp "target/${{ matrix.target }}/release/$bin" "dist/$out/"
          fi
          # THIRD-PARTY-NOTICES.md carries the GeoNames CC-BY attribution, which
          # has to travel with the binary that embeds the dataset.
          cp README.md LICENSE* THIRD-PARTY-NOTICES.md "dist/$out/" 2>/dev/null || true
          # winget manifests cannot reference a .tar.gz, so Windows ships a zip.
          case "${{ matrix.target }}" in
            *windows*) (cd dist && 7z a -tzip "$out.zip" "$out" >/dev/null) ;;
            *)         (cd dist && tar czf "$out.tar.gz" "$out") ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: photorg-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Sigstore provenance is signed with a short-lived certificate bound to
      # this workflow run, so releases are verifiable without anyone holding a
      # long-lived signing key.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          body: |
            Verify a download before running it:

            ```sh
            sha256sum -c SHA256SUMS --ignore-missing
            gh attestation verify photorg-<target>.<tar.gz|zip> --repo ${{ github.repository }}
            ```
          append_body: true
